<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kittr Directory</title>

    <!-- 1. TAILWIND CSS (Cukup 1 CDN Script Ini Aja, Gadot!) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- 3. STYLESHEET CUSTOM -->
    <link rel="stylesheet" href="src/assets/components/stylesheet.css"/>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <div class="logo">
                Kittr
            </div>
        </div>

        <ul class="nav-center" id="navMenu">
            <li><a href="#about">About</a></li>
            <li><a href="#tools">Tools</a></li>
            <li><a href="#github">Github</a></li>
            <li><a href="#donate">Donate</a></li>
        </ul>

        <div class="nav-right" id="navRight">

            <!-- ===== SEARCH BAR ===== -->
            <form class="search-form" id="searchForm" role="search" onsubmit="handleSearch(event)">
                <input
                    type="search"
                    class="search-input"
                    id="searchInput"
                    placeholder="Search..."
                    aria-label="Search"
                    autocomplete="off"
                >
                <button type="button" class="search-btn" id="searchBtn" aria-label="Toggle search">
                    <i class="fas fa-search"></i>
                </button>
            </form>

            <a href="#" class="btn-tipu">
                SHARE
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>


    <!-- ===== KOTAK-KOTAK KATEGORI ===== -->
    <main class="container mx-auto">
        <div class="flex flex-wrap justify-center gap-4 mt-8 px-4">
            <div class="box-web flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Web Utilities</div>
            <div class="box-net flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Networking</div>
            <div class="box-iot flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">IOT</div>
            <div class="box-dev flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Web Dev</div>
            <div class="box-prog flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Programming</div>
            <div class="box-local flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Local Server</div>
            <div class="box-sim flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Simulator</div>
            <div class="box-design flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Design</div>
            <div class="box-repo flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg text-white cursor-pointer hover:scale-105 transition-transform">Repository Github</div>
            <div class="box-edu flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Education & Course</div>
            <div class="box-script flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Script & Mods</div>
            <div class="box-browser flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Web Browser</div>
            <div class="box-secure flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg cursor-pointer hover:scale-105 transition-transform">Security & Privacy</div>
        </div>
    </main>

    <!-- ===== FILE JS EKSTERNAL ===== -->
    <script src="/src/services/script.js"></script>
</body>
</html>
