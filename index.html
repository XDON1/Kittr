<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/assets/components/stylesheet.css" />
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 2. FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <title>Document</title>
</head>
<body>
    <nav>
        <!-- Logo Nav -->
        <div class="navbar-brand">Logo</div>

        <!-- Nav Menu -->
        <div class="navbar-menu">
            <ul>
                <li><a href="">About</a></li>
                <li><a href="">Tools</a></li>
                <li><a href="">Github</a></li>
                <li><a href="">Donate</a></li>
            </ul>
        </div>

        <div class="navbar-actions">

            <!-- Search Bar -->
            <form class="navbar-search" role="search">
                <input type="search" placeholder="Search..."/>
            </form>
            <!-- Toggle Switch Theme -->
            <div class="navbar-toggle">
                <input type="checkbox" id="theme-toggle">
                <label for="theme-toggle"></label>
            </div>
            <!-- Hamburger Menu -->
            <button class="navbar-hamburger" aria-label="Open menu" aria-expanded="false">
            </button>
        </div>
    </nav>

   
    <!-- =====  KOTAK-KOTAK KATEGORI ===== -->
    <div class="flex flex-wrap justify-evenly gap-4 mt-6 px-4">
        <!-- Sekarang pake class custom (box-web, box-net, dll) yang warnanya ada di style.css -->
        <div class="box-web flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Web Utilities</div>
        <div class="box-net flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Networking</div>
        <div class="box-iot flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">IOT</div>
        <div class="box-dev flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Web Dev</div>
        <div class="box-prog flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Programming</div>
        <div class="box-local flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Local Server</div>
        <div class="box-sim flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Simulator</div>
        <div class="box-design flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Design</div>
        <div class="box-repo flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg text-white">Repository Github</div>
        <div class="box-edu flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Education & Course</div>
        <div class="box-script flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Script & Mods</div>
        <div class="box-browser flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Web Browser</div>
        <div class="box-secure flex items-center justify-center text-center size-[100px] shrink-0 rounded-lg">Security & Privacy</div>
    </div>

    <!-- ===== FILE JS EKSTERNAL ===== -->
    <script src="script.js"></script>

</body>
</html>
